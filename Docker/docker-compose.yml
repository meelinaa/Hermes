services:
  hermes-jaeger:
    image: jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  hermes-mailhog:
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Web UI Port

  hermes-redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  hermes-mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      TZ: Europe/Berlin
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - hermes_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    
  hermes-migrate:
    image: docker-hermes-migrate
    build:
      context: ..
      dockerfile: Docker/Dockerfile.Migrate
    environment:
      - ConnectionStrings__DefaultConnection=Server=hermes-mysql;Port=${MYSQL_INTERNAL_PORT};Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};SslMode=none;AllowPublicKeyRetrieval=True;
      - TZ=Europe/Berlin
    depends_on:
      hermes-mysql:
        condition: service_healthy
    restart: "no"

  hermes-api:
    build: 
      context: ..
      dockerfile: Docker/Dockerfile.Api
    ports:
      - "5165:5165"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=hermes-mysql;Port=${MYSQL_INTERNAL_PORT};Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};SslMode=none;AllowPublicKeyRetrieval=True;
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - TZ=Europe/Berlin
      - OpenTelemetry__Enabled=true
      - OpenTelemetry__OtlpEndpoint=http://hermes-jaeger:4317
      - OpenTelemetry__Protocol=grpc
    depends_on:
      hermes-mysql:
        condition: service_healthy
      hermes-migrate:
        condition: service_completed_successfully
      hermes-jaeger:
        condition: service_started

  hermes-worker:
    build: 
      context: ..
      dockerfile: Docker/Dockerfile.Worker
    ports:
      - "5166:5166"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=hermes-mysql;Port=${MYSQL_INTERNAL_PORT};Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};SslMode=none;AllowPublicKeyRetrieval=True;
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Email__Host=${MAIL_HOST}
      - Email__Port=${MAIL_PORT}
      - MailHog__BaseUrl=http://hermes-mailhog:8025
      - NewsDataIo__Key=${NEWS_DATA_IO_KEY}
      - Newsletter__TimeZoneId=Europe/Berlin
      - TZ=Europe/Berlin
      - ConnectionStrings__Redis=hermes-redis:6379
      - OpenTelemetry__Enabled=true
      - OpenTelemetry__OtlpEndpoint=http://hermes-jaeger:4317
      - OpenTelemetry__Protocol=grpc
    depends_on:
      hermes-mysql:
        condition: service_healthy
      hermes-migrate:
        condition: service_completed_successfully
      hermes-mailhog:
        condition: service_started
      hermes-jaeger:
        condition: service_started

  # hermes-web:
  #   build:
  #     context: ..
  #     dockerfile: Docker/Dockerfile.Web
  #   ports:
  #     - "7016:7016"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - ApiBaseUrl=http://localhost:5165  
  #   depends_on:
  #     - hermes-api

volumes:
  hermes_data: