# Weekly dependency bumps; review + merge PRs and triage CVEs alongside Trivy (see ci-cd.yml security-scan job).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    groups:
      aspnet-ecosystem:
        patterns:
          - Microsoft.*
          - System.*
      otel:
        patterns:
          - OpenTelemetry.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
