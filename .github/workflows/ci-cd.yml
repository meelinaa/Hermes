name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'test/**'
      - 'fix/**'
      - 'refactor/**'

  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'test/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-nuget:
    name: NuGet Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Hermes.sln

      - name: Check for Vulnerable Packages
        run: dotnet list Hermes.sln package --vulnerable --include-transitive

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [security-nuget]
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Hermes.sln

      - name: Create Test Results Directory
        run: mkdir -p ${{ github.workspace }}/test-results/coverage

      - name: Build Solution
        run: dotnet build Hermes.sln --configuration Release --no-restore

      - name: Run WebFrontend Client Tests (bUnit)
        run: |
          dotnet test Hermes.WebFrontend/Hermes.WebFrontend.Client.Tests/Hermes.WebFrontend.Client.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=client-bunit-results.trx" \
            --results-directory ${{ github.workspace }}/test-results

      - name: Run Unit Tests
        run: |
          dotnet test Hermes.UnitTests/Hermes.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --results-directory ${{ github.workspace }}/test-results \
            /p:CollectCoverage=true \
            /p:CoverletOutput="${{ github.workspace }}/test-results/coverage/unit" \
            /p:CoverletOutputFormat=json

      - name: Run Integration Tests (merged coverage gate)
        run: |
          dotnet test Hermes.IntegrationTests/Hermes.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --results-directory ${{ github.workspace }}/test-results \
            /p:CollectCoverage=true \
            /p:MergeWith="${{ github.workspace }}/test-results/coverage/unit.json" \
            /p:CoverletOutput="${{ github.workspace }}/test-results/coverage/combined" \
            /p:CoverletOutputFormat=json \
            /p:ThresholdType=line \
            /p:ThresholdStat=total \
            /p:Threshold=65
      - name: Upload Code Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: ${{ github.workspace }}/test-results/coverage/

      - name: Publish Test Results
        uses: dorny/test-reporter@v1.9.1
        if: success() || failure()
        with:
          name: .NET Test Results
          path: '${{ github.workspace }}/test-results/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/test-results/*.trx

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api
            dockerfile: Docker/Dockerfile.Api
            context: .

          - name: worker
            dockerfile: Docker/Dockerfile.Worker
            context: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize image repository name
        shell: bash
        run: echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image (Push only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Export Docker Image (PR only)
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          outputs: type=docker,dest=/tmp/${{ matrix.service.name }}.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker Image Artifact (PR only)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.service.name }}
          path: /tmp/${{ matrix.service.name }}.tar
          retention-days: 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      matrix:
        service:
          - api
          - worker

    steps:
      - name: Normalize image repository name
        shell: bash
        run: echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry (Push only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Docker Image Artifact (PR only)
        if: github.event_name != 'push'
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.service }}
          path: /tmp

      - name: Run Trivy Scanner (Registry)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-${{ matrix.service }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Scanner (Tarball)
        if: github.event_name != 'push'
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/${{ matrix.service }}.tar
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.service }}

      - name: Fail on CRITICAL vulnerabilities (main only)
        if: github.ref_name == 'main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-${{ matrix.service }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}